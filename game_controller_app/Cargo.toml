[package]
authors = { workspace = true }
description = "The GUI application of the RoboCup Humanoid Soccer League GameController"
edition = { workspace = true }
license = { workspace = true }
name = "game_controller_app"
repository = { workspace = true }
# egui/eframe require a newer compiler than the rest of the workspace.
rust-version = "1.95"
version = { workspace = true }

[dependencies]
anyhow = { workspace = true }
eframe = { workspace = true }
enum-map = { workspace = true }
game_controller_core = { workspace = true }
game_controller_runtime = { workspace = true }
tokio = { workspace = true }

# The icon of the executable on Windows (shown by the Explorer, shortcuts and the list of installed
# apps) is a resource that the build script embeds.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
