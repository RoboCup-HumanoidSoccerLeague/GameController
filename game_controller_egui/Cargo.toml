[package]
authors = { workspace = true }
description = "The egui GUI application of the RoboCup Humanoid Soccer League GameController"
edition = { workspace = true }
license = { workspace = true }
name = "game_controller_egui"
repository = { workspace = true }
# egui/eframe require a newer compiler than the rest of the workspace.
rust-version = "1.95"
version = { workspace = true }

[[bin]]
name = "game_controller_egui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wayland", "wgpu", "x11"] }
enum-map = { workspace = true }
game_controller_core = { workspace = true }
game_controller_runtime = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
clap = { workspace = true }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
serde = { workspace = true }
serde_json = { version = "1.0" }
serde_yaml = { workspace = true }
