name: Make Distribution

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  dist:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - if: ${{ startsWith(matrix.os, 'macos') }}
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # The app is signed with a self-signed certificate (see dist/macos/create-signing-certificate)
          # so that its identity is the same for all releases.
          if [ -n "${MACOS_CERTIFICATE}" ]; then
            keychain="${RUNNER_TEMP}/signing.keychain-db"
            security create-keychain -p ci "${keychain}"
            security set-keychain-settings -lut 21600 "${keychain}"
            security unlock-keychain -p ci "${keychain}"
            base64 --decode <<<"${MACOS_CERTIFICATE}" >"${RUNNER_TEMP}/signing.p12"
            security import "${RUNNER_TEMP}/signing.p12" -k "${keychain}" -P "${MACOS_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k ci "${keychain}"
            export CODESIGN_KEYCHAIN="${keychain}"
            export CODESIGN_IDENTITY="$(security find-identity -p codesigning "${keychain}" | sed -n 's/^ *1) \([0-9A-F]*\) .*/\1/p')"
          fi
          dist/mkdist "${GITHUB_REF_NAME}"
      - if: ${{ startsWith(matrix.os, 'ubuntu') }}
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libayatana-appindicator3-dev libclang-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
          dist/mkdist "${GITHUB_REF_NAME}"
      - if: ${{ startsWith(matrix.os, 'windows') }}
        run: |
          dist/mkdist.ps1 "$env:GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.tar.bz2
            dist/*.zip
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes need the history and the previous tags.
          fetch-depth: 0
      - name: Check that the tag matches the version in Cargo.toml
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)"
      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dist/release-notes "${GITHUB_REF_NAME}" >notes.md
          gh release create "${GITHUB_REF_NAME}" assets/* --draft --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file notes.md \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
